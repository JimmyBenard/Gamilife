name: Build Gamilife APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Tests and APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests and assemble APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare standalone APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gamilife-0.1.0.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamilife-0.1.0-apk
          path: Gamilife-0.1.0.apk
          if-no-files-found: error
